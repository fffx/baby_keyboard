name: App build
on:
  push:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.4.0). If empty, auto-detects from tag or project version.'
        required: false
        type: string

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.determine_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Switch xcode to latest-stable
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Unlock Login Keychain
        run: |
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db || true
      - name: Setup Headless Code Signing Keychain
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSPHRASE }}
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Run tests
        env:
          NSUnbufferedIO: "YES"
        run: mise run test
      - name: Determine Release Tag
        id: determine_tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -m1 "MARKETING_VERSION" BabyKeyboardLock.xcodeproj/project.pbxproj | tr -d ';\t ' | cut -d'=' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build and archive macOS app
        env:
          GITHUB_REF_NAME: ${{ steps.determine_tag.outputs.tag }}
        run: mise run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: build/BabyKeyboardLock-${{ steps.determine_tag.outputs.tag }}.zip
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          files: BabyKeyboardLock-${{ needs.build.outputs.tag }}.zip
          generate_release_notes: true
